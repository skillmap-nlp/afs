<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js" charset="utf-8"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;font-family:Inter,Helvetica Neue,Arial,sans-serif;}
  body{display:flex;flex-direction:column;height:100vh;}
  #chart{flex:1 1 auto;width:100%;min-height:0;}
</style></head>
<body style="margin:0;overflow:hidden;">
<div id="chart"></div>
<script>
var DATA = {"model": {"Kenya": {"on_pct": 2.96, "off_pct": 7.6, "afs_pct": 10.68, "n_total": 562793, "n_afs": 60087}, "Nigeria": {"on_pct": 0.94, "off_pct": 11.29, "afs_pct": 12.33, "n_total": 629372, "n_afs": 77591}, "Uganda": {"on_pct": 3.0, "off_pct": 6.29, "afs_pct": 9.27, "n_total": 129418, "n_afs": 11999}, "Pooled": {"on_pct": 2.0, "off_pct": 9.23, "afs_pct": 11.33, "n_total": 1321583, "n_afs": 149677}}, "keyword": {"Kenya": {"on_pct": 2.19, "off_pct": 1.23, "afs_pct": 4.29, "n_total": 562793, "n_afs": 24161}, "Nigeria": {"on_pct": 1.02, "off_pct": 1.84, "afs_pct": 4.07, "n_total": 629372, "n_afs": 25629}, "Uganda": {"on_pct": 2.22, "off_pct": 0.66, "afs_pct": 3.38, "n_total": 129418, "n_afs": 4369}, "Pooled": {"on_pct": 1.63, "off_pct": 1.46, "afs_pct": 4.1, "n_total": 1321583, "n_afs": 54159}}};
var ORDER = ["Kenya","Nigeria","Uganda","Pooled"];
var COLOR_MODEL = "#2563eb", COLOR_KEYWORD = "#f59e0b";

function buildTrace(method, name, color){
  var d = DATA[method];
  var afs = ORDER.map(function(c){ return d[c].afs_pct; });
  var on  = ORDER.map(function(c){ return d[c].on_pct; });
  var off = ORDER.map(function(c){ return d[c].off_pct; });
  return {
    type:"bar", name:name, x:ORDER, y:afs, marker:{color:color},
    text: afs.map(function(v){return v.toFixed(1)+"%";}), textposition:"outside",
    textfont:{size:10, color:"#475569"}, cliponaxis:false,
    customdata: ORDER.map(function(c,i){ return [on[i], off[i]]; }),
    hovertemplate:"<b>%{x} · "+name+"</b><br>AFS share: <b>%{y:.2f}%</b>"+
      "<br>On-farm: %{customdata[0]:.2f}%<br>Off-farm: %{customdata[1]:.2f}%<extra></extra>"
  };
}

function build(){
  var traces = [
    buildTrace("model", "Contextual model", COLOR_MODEL),
    buildTrace("keyword", "Keyword", COLOR_KEYWORD)
  ];
  var allv = traces[0].y.concat(traces[1].y);
  var ymax = Math.max.apply(null, allv) * 1.22 + 1;
  var layout = {
    barmode:"group", bargap:0.28, bargroupgap:0.12,
    title:{ text:"<b>AFS share of all online postings — contextual model vs keyword</b><br>"+
            "<span style='font-size:11px;color:#888'>Share of postings classified as AFS · Lightcast + major portals · 2021–2024</span>",
            x:0.01, xanchor:"left", font:{size:14, color:"#333"} },
    font:{family:"Inter, Helvetica Neue, Arial, sans-serif", color:"#333"},
    plot_bgcolor:"white", paper_bgcolor:"white",
    margin:{l:48, r:18, t:78, b:34},
    legend:{orientation:"h", yanchor:"bottom", y:1.0, xanchor:"right", x:1, font:{size:11}},
    xaxis:{showgrid:false, showline:true, linecolor:"#CCC", tickfont:{color:"#666", size:12}},
    yaxis:{ticksuffix:"%", showgrid:true, gridcolor:"#EEE", range:[0, ymax],
            tickfont:{color:"#888", size:11}, zeroline:false}
  };
  Plotly.react("chart", traces, layout, {displayModeBar:false, responsive:true});
}

window.addEventListener("resize", function(){
  try{ Plotly.Plots.resize(document.getElementById("chart")); }catch(err){}
});

build();
window.addEventListener("load", function(){
  try{ window.parent.postMessage({type:"afs-ready"}, "*"); }catch(err){}
});
</script>
</body></html>
