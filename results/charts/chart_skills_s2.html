<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;padding:0;overflow:hidden;font-family:Inter,Helvetica Neue,Arial,sans-serif;color:#1f2937;background:#fff;}
  body{box-sizing:border-box;padding:8px 4px 0 4px;}
  .mt-bar{display:flex;flex-direction:column;align-items:flex-start;gap:0.28rem;margin-bottom:28px;}
  .mt-lab{font-size:0.72rem;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:#64748b;}
  .mt-seg{display:inline-flex;border:1px solid #cbd5e1;border-radius:999px;overflow:hidden;}
  .mt-seg button{border:none;padding:0.32rem 0.85rem;font-weight:800;font-size:0.82rem;cursor:pointer;background:#fff;color:#475569;font-family:inherit;}
  .mt-seg button.on{background:#2563eb;color:#fff;}
  .wrap{width:100%;box-sizing:border-box;padding:0 12px;}
  h1{font-size:14px;line-height:1.25;margin:0 0 3px 0;font-weight:800;color:#2f2f2f;}
  .sub{font-size:12px;color:#777;margin:0 0 28px 0;}
  .grid{display:grid;grid-template-columns:minmax(108px,0.75fr) repeat(3,minmax(0,1.32fr));border-top:1px solid #dfe3e8;border-left:1px solid #dfe3e8;width:100%;box-sizing:border-box;}
  .th,.td{border-right:1px solid #dfe3e8;border-bottom:1px solid #dfe3e8;box-sizing:border-box;}
  .th{background:#f4f6f8;color:#2c3e50;font-size:11px;font-weight:800;padding:9px 10px;line-height:1.1;}
  .td{min-height:72px;padding:8px 10px;font-size:10.5px;line-height:1.35;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
  .group{font-size:11px;font-weight:500;color:#1f2937;}
  .item{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
  .pct{color:#718096;}
  .source{font-size:9px;color:#aaa;margin:70px 16px 0 16px;}
  @media (max-width:680px){
    .wrap{padding:0 8px;}
    .grid{grid-template-columns:minmax(98px,0.68fr) repeat(3,minmax(0,1.35fr));}
    .th{font-size:10.5px;padding:8px 8px;}
    .td{min-height:74px;padding:7px 8px;font-size:9.7px;line-height:1.32;}
    .group{font-size:10.5px;}
  }
  #skill-desc-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:9999;align-items:center;justify-content:center;padding:20px;}
  #skill-desc-card{max-width:760px;width:100%;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
  #skill-desc-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #eee;}
  #skill-desc-title{font-size:16px;font-weight:700;color:#2c3e50;}
  #skill-desc-close{border:none;background:none;font-size:22px;cursor:pointer;color:#777;line-height:1;}
  #skill-desc-body{padding:14px 16px 16px;font-size:14px;line-height:1.55;color:#4a4a4a;}
</style></head>

  var rows = ((PAYLOAD[state.method]||{})[state.country] || []);
  var g = document.getElementById("grid");
  g.innerHTML = '<div class="th">Skill group</div><div class="th">On-farm top 3</div><div class="th">Off-farm top 3</div><div class="th">Non-AFS top 3</div>';
  rows.forEach(function(r){
    g.insertAdjacentHTML("beforeend",
      '<div class="td group" style="background:'+esc(r.fills.group)+'">'+esc(r.group)+'</div>'
      + '<div class="td data-cell" style="background:'+esc(r.fills.on)+'">'+cell("on",r)+'</div>'
      + '<div class="td data-cell" style="background:'+esc(r.fills.off)+'">'+cell("off",r)+'</div>'
      + '<div class="td data-cell" style="background:'+esc(r.fills.non)+'">'+cell("non",r)+'</div>');
  });
}
function openModal(label){
  var key = norm(label), desc = SKILL_DESC[key] || "Description not available in ESCO metadata.";
  document.getElementById("skill-desc-title").textContent = label;
  document.getElementById("skill-desc-body").textContent = desc;
  document.getElementById("skill-desc-modal").style.display = "flex";
}
document.addEventListener("click", function(e){
  var b = e.target.closest && e.target.closest("#method-seg button");
  if(b){state.method=b.getAttribute("data-m"); render(); return;}
  var item = e.target.closest && e.target.closest(".item");
  if(item){openModal(item.getAttribute("data-label")); return;}
});
document.getElementById("skill-desc-close").addEventListener("click", function(){document.getElementById("skill-desc-modal").style.display="none";});
document.getElementById("skill-desc-modal").addEventListener("click", function(e){if(e.target.id==="skill-desc-modal") e.currentTarget.style.display="none";});
window.addEventListener("message", function(e){
  if(!e.data) return;
  if(e.data.type === "afs-method" && (e.data.method === "model" || e.data.method === "keyword")){state.method=e.data.method; render();}
  if(e.data.type === "afs-update" || e.data.type === "afs-frame"){
    var changed=false;
    if(typeof e.data.country === "string" && PAYLOAD[state.method][e.data.country]){state.country=e.data.country; changed=true;}
    if(typeof e.data.method === "string" && (e.data.method === "model" || e.data.method === "keyword")){state.method=e.data.method; changed=true;}
    if(changed) render();
  }
});
render();
try { window.parent.postMessage({type:"afs-ready"}, "*"); } catch(e) {}
</script>
</body></html>
