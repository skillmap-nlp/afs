function paintBtns(){
  document.querySelectorAll("#method-seg button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-m") === method);
  });
}
function prettify(s){ return s.toLowerCase().replace(/\b\w/g, function(c){return c.toUpperCase();}); }
function truncate(s, n){ return s.length > n ? s.slice(0, n - 1) + "\u2026" : s; }
function titleHtml(c){
  return "<b>" + TITLE_MAIN + "</b><br><span style='font-size:12px;color:#888'>" +
         "Each bar = group's share of all S1\u2013S8 skill entries \u00b7 Country: <b>" + c + "</b></span>";
}
function resize(){ try { Plotly.Plots.resize(document.getElementById("chart")); } catch(e){} }
function restyleAll(){
  var gd = document.getElementById("chart");
  var d = ((AFS_DATA[method] || {})[country]) || {on: ZEROS, off: ZEROS};
  try { Plotly.restyle(gd, {x: [d.on]}, [0]); } catch(e){}
  try { Plotly.restyle(gd, {x: [d.off]}, [1]); } catch(e){}
  var nd = ((NACE[method] || {})[country]) || {};
  for (var i = 0; i < 3; i++){
    var lbl = naceList[i], x, name, show;
    if (lbl && nd[lbl]) { x = nd[lbl]; name = truncate(prettify(lbl), 32); show = true; }
    else { x = ZEROS; name = "slot" + i; show = false; }
    try { Plotly.restyle(gd, {x: [x], name: name, showlegend: show}, [2 + i]); } catch(e){}
  }
  try { Plotly.relayout(gd, {"title.text": titleHtml(country)}); } catch(e){}
}
function render(){
  Plotly.newPlot("chart", FIG.data, FIG.layout,
                 {displayModeBar:false, responsive:true}).then(function(){
    restyleAll(); resize();
  });
}
document.querySelectorAll("#method-seg button").forEach(function(b){

    method = b.getAttribute("data-m"); paintBtns(); restyleAll();
    try { window.parent.postMessage({type:"afs-method-local", method:method}, "*"); } catch(err){}
  });
});
window.addEventListener("message", function(e){
  if(!e.data) return;

});
