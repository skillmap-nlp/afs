var FRAME_KEYS = ["country"];
var STATE = {"country": "Kenya"};
var method = "model";

function paintBtns(){
  document.querySelectorAll("#method-seg button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-m") === method);
  });
}
function frameName(){
  return FRAME_KEYS.map(function(k){ return STATE[k]; }).join("|");
}
function resize(){
  try { Plotly.Plots.resize(document.getElementById("chart")); } catch(e) {}
}
function render(){
  var f = FIGS[method];
  var fig = { data: f.data, layout: f.layout, frames: f.frames || [] };
  Plotly.newPlot("chart", fig.data, fig.layout,
                 {displayModeBar:false, responsive:true}).then(function(){
    if (fig.frames && fig.frames.length) {
      try { Plotly.addFrames("chart", fig.frames); } catch(e) {}
      if (FRAME_KEYS.length) {
        try {
          Plotly.animate("chart", [frameName()],
            {mode:"immediate", frame:{duration:0, redraw:true}, transition:{duration:0}});
        } catch(e) {}
      }
    }
    resize();
  });
}
function setMethod(m){
  if(m !== "model" && m !== "keyword") return;
  method = m; paintBtns(); render();
  try { window.parent.postMessage({type:"afs-method-local", method:m}, "*"); } catch(err) {}
}

document.querySelectorAll("#method-seg button").forEach(function(b){
  b.addEventListener("click", function(){ setMethod(b.getAttribute("data-m")); });
});

window.addEventListener("message", function(e){
  if(!e.data) return;
  if(e.data.type === "afs-method" && (e.data.method === "model" || e.data.method === "keyword")){
    method = e.data.method; paintBtns(); render(); return;
  }
  if(e.data.type === "afs-update" || e.data.type === "afs-frame"){
    var changed = false;
    FRAME_KEYS.forEach(function(k){
      if(typeof e.data[k] === "string" && e.data[k] !== STATE[k]){ STATE[k] = e.data[k]; changed = true; }
    });
    if(changed && FRAME_KEYS.length){
      try {
        Plotly.animate("chart", [frameName()],
          {mode:"immediate", frame:{duration:350, redraw:true}, transition:{duration:350, easing:"cubic-in-out"}});
      } catch(err) {}
    }
    return;
  }
  if(e.data.type === "plotly-resize"){ resize(); }
});
window.addEventListener("resize", resize);

paintBtns();
render();
[60,150,350,700,1400].forEach(function(t){ setTimeout(resize, t); });

  try { window.parent.postMessage({type:"afs-ready"}, "*"); } catch(err) {}
});
