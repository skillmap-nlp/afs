var SEG_COLOR = {"On-farm":"#66bb6a","Off-farm":"#42a5f5"};
var country = "Pooled";
var seg = "Off-farm";
function paintBtns(){
  document.querySelectorAll("#cty-seg button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-c") === country);
  });
  document.querySelectorAll("#seg-seg button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-s") === seg);
  });
}
function build(){
  var ROWS = ((DATA[country] || {})[seg]) || [];
  var labels = ROWS.map(function(r){return r[0];}).reverse();
  var lifts  = ROWS.map(function(r){return r[1];}).reverse();
  var cnts   = ROWS.map(function(r){return r[2];}).reverse();
  var ctyTxt = (country === "Pooled") ? "all portals" : country;
  var traces = [{type:"bar", orientation:"h", x:lifts, y:labels,
    marker:{color:SEG_COLOR[seg]},
    text:lifts.map(function(v){return "×"+v.toFixed(1);}), textposition:"outside", textfont:{size:10},
    customdata:cnts,
    hovertemplate:"%{y}<br>lift vs Lightcast "+seg+" AFS ("+ctyTxt+"): <b>×%{x:.2f}</b><br>%{customdata} portal "+seg+" postings<extra></extra>"}];
  var xmax = lifts.length ? Math.max.apply(null, lifts)*1.15 : 1;

}
