var CONTROLS = {"groups": [{"label": "View", "options": ["Sub-regions", "Districts"]}, {"label": "Metric", "options": ["% AFS", "% On-farm", "% Off-farm"]}], "vismap": {"0|0": [true, true, false, false, false, false, false, false], "0|1": [true, false, true, false, false, false, false, false], "0|2": [true, false, false, true, false, false, false, false], "1|0": [false, false, false, false, true, true, false, false], "1|1": [false, false, false, false, true, false, true, false], "1|2": [false, false, false, false, true, false, false, true]}, "default": [0, 0]};
var method = "model";  // default: Qwen classifier
var sel = (CONTROLS.default || []).slice();

function resolveGeo(f){
  if(!f || !f.data) return;
  f.data.forEach(function(t){
    if(t.geojson && t.geojson.$ref){ t.geojson = GEO[t.geojson.$ref]; }
  });
}
Object.keys(FIGS).forEach(function(m){ resolveGeo(FIGS[m]); });

function paintMethod(){
  document.querySelectorAll("#method-seg button").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-m") === method);
  });
}
function renderControls(){
  var bar = document.getElementById("ctrl-bar");
  if(!bar || !CONTROLS.groups) return;
  bar.innerHTML = "";
  CONTROLS.groups.forEach(function(g, gi){
    var grp = document.createElement("span"); grp.className = "mt-grp";
    var lab = document.createElement("span"); lab.className = "mt-lab"; lab.textContent = g.label;
    var seg = document.createElement("span"); seg.className = "mt-seg";
    g.options.forEach(function(opt, oi){
      var b = document.createElement("button"); b.type = "button"; b.textContent = opt;
      if(sel[gi] === oi) b.className = "on";
      b.addEventListener("click", function(){ sel[gi] = oi; paintControls(); build(); });
      seg.appendChild(b);
    });
    grp.appendChild(lab); grp.appendChild(seg); bar.appendChild(grp);
  });
}
function paintControls(){
  var bar = document.getElementById("ctrl-bar"); if(!bar) return;
  var segs = bar.querySelectorAll(".mt-seg");
  (CONTROLS.groups||[]).forEach(function(g, gi){
    if(!segs[gi]) return;
    segs[gi].querySelectorAll("button").forEach(function(b, oi){
      b.classList.toggle("on", sel[gi] === oi);
    });
  });
}
function applyVis(f){
  var vm = CONTROLS.vismap; if(!vm) return;
  var vis = vm[sel.join("|")]; if(!vis) return;
  for(var i=0; i<f.data.length && i<vis.length; i++){ f.data[i].visible = vis[i]; }
}
function build(){
  var f = FIGS[method];
  applyVis(f);
  Plotly.react("chart", f.data, f.layout, {displayModeBar:"hover", responsive:true});
  setTimeout(function(){ try{ Plotly.Plots.resize(document.getElementById("chart")); }catch(e){} }, 60);
}
function setMethod(m){
  if(m !== "model" && m !== "keyword") return;
  method = m; paintMethod(); build();
  try{ window.parent.postMessage({type:"afs-method-local", method:m}, "*"); }catch(err){}
}

document.querySelectorAll("#method-seg button").forEach(function(b){
  b.addEventListener("click", function(){ setMethod(b.getAttribute("data-m")); });
});
window.addEventListener("message", function(e){
  if(!e.data) return;
  if(e.data.type === "afs-method" && (e.data.method === "model" || e.data.method === "keyword")){
    method = e.data.method; paintMethod(); build();
  }
  if(e.data.type === "plotly-resize"){ try{ Plotly.Plots.resize(document.getElementById("chart")); }catch(err){} }
});
window.addEventListener("resize", function(){
  try{ Plotly.Plots.resize(document.getElementById("chart")); }catch(err){}
});

renderControls();
paintMethod();
build();
[60,150,350,700,1400].forEach(function(t){ setTimeout(function(){ try{ Plotly.Plots.resize(document.getElementById("chart")); }catch(e){} }, t); });
window.addEventListener("load", function(){
  try{ window.parent.postMessage({type:"afs-ready"}, "*"); }catch(err){}
});
</script>
