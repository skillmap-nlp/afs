<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js" charset="utf-8"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;font-family:Inter,Helvetica Neue,Arial,sans-serif;}
#chart{width:100%;height:100%;}</style></head>
<body style="margin:0;overflow:hidden;">
<div id="chart"></div>
<script>
var SHARES = {"Kenya": {"2024": {"on_pct": 2.76, "off_pct": 7.56, "afs_pct": 10.32, "n": 40536}, "2025": {"on_pct": 2.59, "off_pct": 8.32, "afs_pct": 10.9, "n": 41807}, "2026": {"on_pct": 2.73, "off_pct": 8.34, "afs_pct": 11.07, "n": 3632}}, "Nigeria": {"2024": {"on_pct": 0.89, "off_pct": 9.72, "afs_pct": 10.61, "n": 90404}, "2025": {"on_pct": 1.55, "off_pct": 9.52, "afs_pct": 11.07, "n": 109327}, "2026": {"on_pct": 1.0, "off_pct": 10.27, "afs_pct": 11.26, "n": 12810}}, "Uganda": {"2024": {"on_pct": 4.21, "off_pct": 10.24, "afs_pct": 14.45, "n": 26738}, "2025": {"on_pct": 3.84, "off_pct": 10.94, "afs_pct": 14.78, "n": 27697}, "2026": {"on_pct": 4.41, "off_pct": 13.49, "afs_pct": 17.91, "n": 4758}}, "Pooled": {"2024": {"on_pct": 1.93, "off_pct": 9.25, "afs_pct": 11.19, "n": 157678}, "2025": {"on_pct": 2.15, "off_pct": 9.46, "afs_pct": 11.6, "n": 178831}, "2026": {"on_pct": 2.06, "off_pct": 10.66, "afs_pct": 12.72, "n": 21200}}};
var YEARS = [2024, 2025, 2026];
var COLOR_ON="#66bb6a", COLOR_OFF="#42a5f5";
var METHOD_LABEL = "Qwen classifier";
var COUNTRIES = ["Kenya","Nigeria","Uganda","Pooled"];
var country = "Pooled";

function build(){
  var d = SHARES[country];
  var xs = YEARS.map(String);
  var on = YEARS.map(function(y){ return d[y].on_pct; });
  var off = YEARS.map(function(y){ return d[y].off_pct; });
  var traces = [
    {type:"bar", name:"On-farm", x:xs, y:on, marker:{color:COLOR_ON},
      text:on.map(function(v){return v.toFixed(2)+"%";}), textposition:"outside", textfont:{size:10},
      hovertemplate:"%{x} · On-farm: <b>%{y:.2f}%</b><extra></extra>"},
    {type:"bar", name:"Off-farm", x:xs, y:off, marker:{color:COLOR_OFF},
      text:off.map(function(v){return v.toFixed(2)+"%";}), textposition:"outside", textfont:{size:10},
      hovertemplate:"%{x} · Off-farm: <b>%{y:.2f}%</b><extra></extra>"}
  ];
  var ymax = Math.max.apply(null, on.concat(off))*1.3 + 0.5;
  var layout = {
    barmode:"group",
    title:{text:"<b>AFS share of postings — local portals, "+country+"</b><br>"+
            "<span style='font-size:11px;color:#888'>"+METHOD_LABEL+
            " · MyJobMag / Jobline / GreatUgandaJobs · 2024–2026</span>",
            x:0.01,xanchor:"left",font:{size:14,color:"#333"}},
    font:{family:"Inter, Helvetica Neue, Arial, sans-serif",color:"#333"},
    plot_bgcolor:"white", paper_bgcolor:"white",
    margin:{l:48,r:18,t:96,b:34},
    legend:{orientation:"h",yanchor:"bottom",y:1.0,xanchor:"right",x:1,font:{size:11}},
    updatemenus:[{type:"buttons",direction:"right",x:0.5,xanchor:"center",y:1.04,yanchor:"bottom",
      showactive:true,active:COUNTRIES.indexOf(country),
      bgcolor:"#f4f6f8",bordercolor:"#b8c2cc",borderwidth:1,font:{size:11,color:"#2f2f2f"},
      pad:{r:6,t:3,b:3,l:6},
      buttons: COUNTRIES.map(function(c){return {label:c,method:"skip"};})}],
    xaxis:{showgrid:false,showline:true,linecolor:"#CCC",tickfont:{color:"#666",size:12}},
    yaxis:{ticksuffix:"%",showgrid:true,gridcolor:"#EEE",range:[0,ymax],tickfont:{color:"#888",size:11},zeroline:false}
  };
  Plotly.react("chart", traces, layout, {displayModeBar:false, responsive:true});
  wireButtons();
}

// Country switch: wire the Plotly updatemenu buttons to rebuild with new country.
function wireButtons(){
  var menu = document.querySelectorAll('.updatemenu-button');
  menu.forEach(function(b, i){
    b.style.cursor = "pointer";
    if (b.__afsWired) return;
    b.__afsWired = true;
    b.addEventListener('click', function(){ country = COUNTRIES[i]; build(); });
  });
}

build();
window.addEventListener("resize", function(){
  try{ Plotly.Plots.resize(document.getElementById("chart")); }catch(e){}
});
window.addEventListener("load", function(){
  try{ window.parent.postMessage({type:"afs-ready"}, "*"); }catch(e){}
});
</script></body></html>
