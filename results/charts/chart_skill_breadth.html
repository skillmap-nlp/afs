(function () {
    var current = { country: 'Kenya' };
    function _gd() { return document.querySelector('.js-plotly-plot'); }
    function _animate() {
        var gd = _gd();
        if (!gd || typeof Plotly === 'undefined') return;

            Plotly.animate(gd, [current.country], {
                transition: { duration: 350, easing: 'cubic-in-out' },
