<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.plot.ly/plotly-2.30.0.min.js" charset="utf-8"></script>
<style>html,body{margin:0;padding:0;overflow:hidden;font-family:Inter,Helvetica Neue,Arial,sans-serif;}
#chart{width:100%;height:100%;}</style></head>
<body style="margin:0;overflow:hidden;">
<div id="chart"></div>
<script>
var ROWS = [["collaborate in company's daily operations", 1015.0270469181233, 3136, 8.2], ["follow reporting procedures", 604.6143251412801, 1868, 4.9], ["supervision of persons", 511.3975555263504, 1580, 4.2], ["apply health and safety standards", 451.19505848337496, 1394, 3.7], ["company policies", 441.48497831515317, 1364, 3.6], ["prepare the restaurant for service", 397.4659482192141, 1228, 3.2], ["food hygiene rules", 373.5144171376002, 1154, 3.0], ["instruct kitchen personnel", 373.1907477986595, 1153, 3.0], ["present menus", 344.70784597187543, 1065, 2.8], ["stock shelves", 334.0267577868314, 1032, 2.7], ["notify supervisor", 322.37466158496517, 996, 2.6], ["follow stock control instructions", 308.1332106715731, 952, 2.5], ["serve food in table service", 303.2781705874622, 937, 2.5], ["apply problem solving in social service", 298.09946116441057, 1842, 4.8], ["advise guests on menus for special events", 283.8580102510185, 877, 2.3], ["food and beverages on the menu", 279.6503088447891, 864, 2.3], ["plan", 278.0319621500854, 859, 2.3], ["coordinate transportation", 273.50059140491527, 845, 2.2]];
function build(){
  var labels = ROWS.map(function(r){return r[0];}).reverse();
  var lifts  = ROWS.map(function(r){return r[1];}).reverse();
  var cnts   = ROWS.map(function(r){return r[2];}).reverse();
    var traces = [{type:"bar", orientation:"h", x:lifts, y:labels,
    marker:{color:"#0d9488"},
    text:lifts.map(function(v){return "×"+v.toFixed(1);}), textposition:"outside", textfont:{size:10},
    customdata:cnts,
    hovertemplate:"%{y}<br>lift vs Lightcast AFS: <b>×%{x:.2f}</b><br>%{customdata} portal AFS postings<extra></extra>"}];
  var layout = {
    title:{text:"<b>Skills more frequent in portal AFS than in Lightcast AFS</b><br>"+
            "<span style='font-size:11px;color:#888'>ESCO skills, local-portal AFS postings (2024–2026) vs Lightcast AFS (2021–2023) · lift in share</span>",
            x:0.01,xanchor:"left",font:{size:14,color:"#333"}},
    font:{family:"Inter, Helvetica Neue, Arial, sans-serif",color:"#333"},
    plot_bgcolor:"white", paper_bgcolor:"white",
    margin:{l:230,r:46,t:74,b:34},
    xaxis:{title:"lift (× vs Lightcast AFS share)",showgrid:true,gridcolor:"#EEE",zeroline:false,tickfont:{size:10,color:"#888"}},
    yaxis:{automargin:true,tickfont:{size:11,color:"#333"}}
  };
  Plotly.react("chart", traces, layout, {displayModeBar:false, responsive:true});
}
build();
window.addEventListener("resize", function(){try{Plotly.Plots.resize(document.getElementById("chart"));}catch(e){}});
window.addEventListener("load", function(){try{window.parent.postMessage({type:"afs-ready"}, "*");}catch(e){}});
</script></body></html>
